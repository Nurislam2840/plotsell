<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent vs Buy Calculator — PlotSell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/features.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/features-v2.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F17">
<script>if(localStorage.getItem('plotsell_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');if(localStorage.getItem('plotsell_font'))document.documentElement.style.fontSize={small:'90%',medium:'100%',large:'112%',xlarge:'124%'}[localStorage.getItem('plotsell_font')]||'100%';</script>
</head>
<body>
<div id="navbar-mount"></div>

<header class="page-header">
  <div class="container"><p class="eyebrow">Smart Decision</p><h1>Rent vs Buy</h1><p>Compare the true cost of buying versus renting over time.</p></div>
</header>

<section class="section">
  <div class="container" style="max-width:820px;">
    <div class="emi-form" id="rvb-form">
      <div class="form-group"><label class="form-label">Property Price ($)</label><input type="number" class="form-input" id="rvb-price" value="2000000"></div>
      <div class="grid grid--2" style="gap:1rem;">
        <div class="form-group"><label class="form-label">Down Payment ($)</label><input type="number" class="form-input" id="rvb-down" value="400000"></div>
        <div class="form-group"><label class="form-label">Interest Rate (%/yr)</label><input type="number" class="form-input" id="rvb-rate" value="6.5" step="0.1"></div>
      </div>
      <div class="grid grid--2" style="gap:1rem;">
        <div class="form-group"><label class="form-label">Loan Term (years)</label><input type="number" class="form-input" id="rvb-years" value="20"></div>
        <div class="form-group"><label class="form-label">Appreciation (%/yr)</label><input type="number" class="form-input" id="rvb-appreciation" value="5" step="0.1"></div>
      </div>
      <div class="grid grid--2" style="gap:1rem;">
        <div class="form-group"><label class="form-label">Monthly Rent ($)</label><input type="number" class="form-input" id="rvb-rent" value="4000"></div>
        <div class="form-group"><label class="form-label">Rent Growth (%/yr)</label><input type="number" class="form-input" id="rvb-rent-growth" value="3" step="0.1"></div>
      </div>
    </div>
    <div class="rvb-result">
      <div class="rvb-result__badge" id="rvb-result-badge">Calculate</div>
      <h3 id="rvb-result-title">Enter your numbers above</h3>
      <div class="rvb-result__grid">
        <div class="rvb-result__box" id="rvb-buy-box"><div class="rvb-result__box-label">Buying — Net Cost</div><div class="rvb-result__box-value" id="rvb-buy-total">$0</div><div style="font-size:0.78rem;color:rgba(247,245,239,0.6);margin-top:0.5rem;">EMI: <span id="rvb-emi">$0</span></div></div>
        <div class="rvb-result__box" id="rvb-rent-box"><div class="rvb-result__box-label">Renting — Net Cost</div><div class="rvb-result__box-value" id="rvb-rent-total">$0</div><div style="font-size:0.78rem;color:rgba(247,245,239,0.6);margin-top:0.5rem;">Rent: <span id="rvb-rent-mo">$0</span></div></div>
      </div>
    </div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/favorites.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/custom-select.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/darkmode.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/whatsapp.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/translate.js"></script>
<script src="assets/js/rent-vs-buy.js"></script>
<script src="assets/js/currency.js"></script>
<script src="assets/js/scroll-progress.js"></script>
<script src="assets/js/cookie-consent.js"></script>
<script src="assets/js/font-adjuster.js"></script>
<script src="assets/js/reading-progress.js"></script>
<script src="assets/js/qrcode-generator.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/features-v2-init.js"></script>
</body>
</html>
