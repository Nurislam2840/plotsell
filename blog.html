<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================
     START: Head - Meta
     ============================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — PlotSell</title>
<meta name="description" content="Expert advice, market trends, and guides for land investors.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- ============================================
     END: Head - Meta
     ============================================ -->

<!-- ============================================
     START: CSS Files
     ============================================ -->
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/features.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/features-v2.css">
<!-- ============================================
     END: CSS Files
     ============================================ -->

<!-- ============================================
     START: PWA & Theme
     ============================================ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F17">
<script>if(localStorage.getItem('plotsell_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');if(localStorage.getItem('plotsell_font'))document.documentElement.style.fontSize={small:'90%',medium:'100%',large:'112%',xlarge:'124%'}[localStorage.getItem('plotsell_font')]||'100%';</script>
<!-- ============================================
     END: PWA & Theme
     ============================================ -->
</head>
<body>

<!-- ============================================
     START: Navbar Mount
     ============================================ -->
<div id="navbar-mount"></div>
<!-- ============================================
     END: Navbar Mount
     ============================================ -->

<!-- ============================================
     START: Page Header
     ============================================ -->
<header class="page-header">
  <div class="container">
    <p class="eyebrow">Insights</p>
    <h1>From Our Blog</h1>
    <p>Expert advice, market trends, and guides for land investors.</p>
  </div>
</header>
<!-- ============================================
     END: Page Header
     ============================================ -->

<!-- ============================================
     START: Blog Grid
     ============================================ -->
<section class="section">
  <div class="container">
    <div class="grid grid--3" id="blog-grid"></div>
  </div>
</section>
<!-- ============================================
     END: Blog Grid
     ============================================ -->

<!-- ============================================
     START: Footer Mount
     ============================================ -->
<div id="footer-mount"></div>
<!-- ============================================
     END: Footer Mount
     ============================================ -->

<!-- ============================================
     START: Scripts
     ============================================ -->
<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/darkmode.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/whatsapp.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/translate.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('blog-grid');
    if (!grid) return;
    grid.innerHTML = BLOG_POSTS.map(p => `
      <article class="blog-card" data-reveal>
        <img src="${p.image}" alt="${p.title}">
        <div class="blog-card__body">
          <span class="blog-card__date">${p.date}</span>
          <h3>${p.title}</h3>
          <p class="text-muted">${p.excerpt}</p>
          <p style="margin-top:1rem;"><strong style="color:var(--gold);">${p.author}</strong></p>
        </div>
      </article>`).join('');
    if (typeof initScrollReveal === 'function') initScrollReveal();
  });
</script>
<script src="assets/js/currency.js"></script>
<script src="assets/js/scroll-progress.js"></script>
<script src="assets/js/cookie-consent.js"></script>
<script src="assets/js/font-adjuster.js"></script>
<script src="assets/js/reading-progress.js"></script>
<script src="assets/js/qrcode-generator.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/features-v2-init.js"></script>
<!-- ============================================
     END: Scripts
     ============================================ -->

</body>
</html>
