<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================
     START: Head - Meta
     ============================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — PlotSell</title>
<meta name="description" content="Get in touch with our land specialists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- ============================================
     END: Head - Meta
     ============================================ -->

<!-- ============================================
     START: CSS Files
     ============================================ -->
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/features.css">
<link rel="stylesheet" href="assets/css/dark-mode.css">
<link rel="stylesheet" href="assets/css/features-v2.css">
<!-- ============================================
     END: CSS Files
     ============================================ -->

<!-- ============================================
     START: PWA & Theme
     ============================================ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F17">
<script>if(localStorage.getItem('plotsell_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');if(localStorage.getItem('plotsell_font'))document.documentElement.style.fontSize={small:'90%',medium:'100%',large:'112%',xlarge:'124%'}[localStorage.getItem('plotsell_font')]||'100%';</script>
<!-- ============================================
     END: PWA & Theme
     ============================================ -->
</head>
<body>

<!-- ============================================
     START: Navbar Mount
     ============================================ -->
<div id="navbar-mount"></div>
<!-- ============================================
     END: Navbar Mount
     ============================================ -->

<!-- ============================================
     START: Page Header
     ============================================ -->
<header class="page-header">
  <div class="container">
    <p class="eyebrow">Get in Touch</p>
    <h1>Contact Us</h1>
    <p>Our team is ready to answer your questions.</p>
  </div>
</header>
<!-- ============================================
     END: Page Header
     ============================================ -->

<!-- ============================================
     START: Contact Section
     ============================================ -->
<section class="section">
  <div class="container grid grid--2">
    <div>
      <h2>Let's Talk</h2>
      <p class="text-muted" style="margin:1.5rem 0;">Whether you're looking for your dream plot or want to learn more about our services, our team is here to help.</p>
      <div class="spec-box" style="margin-bottom:1rem;">
        <div class="spec-box__label">Email</div>
        <div class="spec-box__value" style="font-size:1rem;">hello@plotsell.com</div>
      </div>
      <div class="spec-box" style="margin-bottom:1rem;">
        <div class="spec-box__label">Phone</div>
        <div class="spec-box__value" style="font-size:1rem;">+1 (555) 123-4567</div>
      </div>
      <div class="spec-box">
        <div class="spec-box__label">Office</div>
        <div class="spec-box__value" style="font-size:1rem;">Beverly Hills, CA 90210</div>
      </div>
    </div>
    <form data-validate style="background:#fff;padding:2.5rem;border-radius:20px;box-shadow:var(--shadow-md);">
      <div class="form-group"><label class="form-label">Name *</label><input type="text" class="form-input" required></div>
      <div class="form-group"><label class="form-label">Email *</label><input type="email" class="form-input" required></div>
      <div class="form-group"><label class="form-label">Subject</label><input type="text" class="form-input"></div>
      <div class="form-group"><label class="form-label">Message *</label><textarea class="form-textarea" required></textarea></div>
      <button type="submit" class="btn btn--primary" style="width:100%;">Send Message</button>
      <div id="form-success" style="display:none;margin-top:1rem;padding:1rem;background:rgba(200,162,74,0.1);border-radius:12px;color:#0B1F17;font-weight:600;text-align:center;"></div>
    </form>
  </div>
</section>
<!-- ============================================
     END: Contact Section
     ============================================ -->

<!-- ============================================
     START: Footer Mount
     ============================================ -->
<div id="footer-mount"></div>
<!-- ============================================
     END: Footer Mount
     ============================================ -->

<!-- ============================================
     START: Scripts
     ============================================ -->
<script src="assets/js/data.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/darkmode.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/whatsapp.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/translate.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/currency.js"></script>
<script src="assets/js/scroll-progress.js"></script>
<script src="assets/js/cookie-consent.js"></script>
<script src="assets/js/font-adjuster.js"></script>
<script src="assets/js/reading-progress.js"></script>
<script src="assets/js/qrcode-generator.js"></script>
<script src="assets/js/pwa.js"></script>
<script src="assets/js/features-v2-init.js"></script>
<!-- ============================================
     END: Scripts
     ============================================ -->

</body>
</html>
